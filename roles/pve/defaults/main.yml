# proxmox_node/defaults/main.yml

---

# iGPU
pve_radeontop_exporter_path: /usr/local/bin/radeontop-exporter.py

# ipmi
pve_ipmi_exporter_version: "1.10.0"
pve_ipmi_exporter_install_dir: "/opt/ipmi_exporter"
pve_ipmi_exporter_listen_port: 9290

# node_exporter
# use container instead
# pve_node_exporter_version: "1.9.1"
# node_exporter_install_dir: "/opt/node_exporter"
# node_exporter_listen_port: 9100

# pve_exporter
pve_exporter_version: "3.5.3"
pve_exporter_install_dir: "/opt/pve_exporter"
pve_exporter_listen_port: 9221

# backup disk set spindown using hdparm service.
pve_hdparm_disk_id: /dev/disk/by-id/ata-ST3000DM007-1WY10G_ZFN1TN5X # this is the PBS HDD.
# pve_hdparm_disk_id: /dev/sdg # this is the PBS HDD.
pve_hdparm_apm: 128
# 12: 1 minute, 120: 10 minutes, 241: 30 mins, 242: 60 minutes, 243: 90 minutes, 244: 120 minutes
pve_hdparm_spindown: 242  # doesnt work for 60 mins or longer.

### NUT #############################
pve_ups_battery_charge_low: 40 # percent - 90 for tests, 40 for normal.
pve_ups_battery_runtime_low: 720 # seconds - 720 (12 mins) for normal, 2100 (35 mins) for testing

pve_nut_ups_name: "ups"
pve_nut_mode: "standalone"
pve_nut_driver: "usbhid-ups"
pve_nut_port: "auto"
pve_nut_vendorid: "0764"
pve_nut_productid: "0501"
pve_nut_desc: "Home Server UPS (CyberPower CP900EPFCLCD)"
pve_nut_pollinterval: 2
pve_nut_upsmon_pollfreq: 2
pve_nut_upsmon_pollfreqalert: 1
pve_nut_maxretry: 3

pve_nut_admin_user: "admin"
pve_nut_mon_user: "monuser"
pve_nut_mon_pass: "{{ vault_nut_mon_pass }}"

# Docker image versions
pve_alloy_version: "{{ sidecar_alloy_version }}"
pve_disk_status_exporter_version: "latest"
pve_node_exporter_version: "{{ sidecar_node_exporter_version }}"
pve_cadvisor_version: "{{ sidecar_cadvisor_version }}"
