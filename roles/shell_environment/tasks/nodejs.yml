---
# Node.js installation from NodeSource repository

- name: Check if Node.js is already installed
  ansible.builtin.command: node --version
  register: shell_environment_nodejs_check
  changed_when: false
  failed_when: false
  # Read-only probe. Without this the command module skips itself under --check,
  # shell_environment_nodejs_needs_install evaluates against an empty result, and every task gated
  # on it is reported as changed in a dry run when it would really be skipped.
  check_mode: false

- name: Set Node.js installation status
  ansible.builtin.set_fact:
    shell_environment_nodejs_needs_install: >-
      {{
        shell_environment_nodejs_check.rc != 0 or
        (shell_environment_nodejs_check.stdout | regex_replace('^v', '') | split('.') | first | int)
        != (shell_environment_nodejs_major_version | int)
      }}

- name: Remove old Node.js from default repositories
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: absent
  become: true
  when: shell_environment_nodejs_needs_install

- name: Ensure directory exists for /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  when: shell_environment_nodejs_needs_install

- name: Add NodeSource GPG key
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
    dest: /etc/apt/keyrings/nodesource.asc
    mode: '0644'
    force: false
  become: true
  register: shell_environment_nodesource_key
  when: shell_environment_nodejs_needs_install

- name: Ensure python3-debian is installed
  ansible.builtin.apt:
    name: python3-debian
    state: present
  become: true
  when: shell_environment_nodejs_needs_install

- name: Add NodeSource repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ shell_environment_nodejs_major_version }}.x"
    suites: nodistro
    components: main
    signed_by: /etc/apt/keyrings/nodesource.asc
    state: present
  become: true
  register: shell_environment_nodesource_repo
  when: shell_environment_nodejs_needs_install

- name: Remove the superseded NodeSource .list repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodesource.list
    state: absent
  become: true
  when: shell_environment_nodejs_needs_install

- name: Update apt cache after adding NodeSource repo
  ansible.builtin.apt:
    update_cache: true
    # deb822_repository does not refresh the apt cache; apt_repository used to.
    cache_valid_time: "{{ 0 if shell_environment_nodesource_repo is changed else 3600 }}"
  become: true
  when: shell_environment_nodejs_needs_install

- name: Install Node.js from NodeSource
  ansible.builtin.apt:
    name: nodejs
    state: present
  become: true
  when: shell_environment_nodejs_needs_install

- name: Verify Node.js version
  ansible.builtin.command: node --version
  register: shell_environment_nodejs_version
  changed_when: false
  failed_when: false
  when: shell_environment_nodejs_needs_install

- name: Assert Node.js version is 20 or higher
  ansible.builtin.assert:
    that:
      - shell_environment_nodejs_version.rc == 0
      - shell_environment_nodejs_version.stdout | regex_replace('^v', '') is version('20.0.0', '>=', version_type='semver')
    fail_msg: "Node.js version {{ shell_environment_nodejs_version.stdout | default('unknown') }} is below required v20.0.0"
    success_msg: "Node.js {{ shell_environment_nodejs_version.stdout }} installed successfully"
  # The verify command above is skipped in check mode, so there is nothing to assert on
  when: shell_environment_nodejs_needs_install and not ansible_check_mode
