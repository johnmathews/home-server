# roles/family_finances_lxc/defaults/main.yml
#
# The family finances app (github.com/johnmathews/family-finances).
# Two containers: a FastAPI backend holding one encrypted SQLite file per
# household, and nginx serving the built Vue app and proxying /api to it.

pgid: 1001

# Monitoring sidecars — pinned to the versions deployed elsewhere on the
# estate. Bump deliberately: handlers use pull:never, so pull on the host first
# or run `make refresh-sidecars`.
node_exporter_version: "v1.12.1"
alloy_version: "v1.18.0"
cadvisor_version: "v0.55.1"

family_finances_docker_compose_dir: "{{ docker_compose_dir }}"

# ghcr image tag = the git commit SHA the images were built from. Pin it, do
# not track `latest`: the app deliberately builds images only from a green
# `main`, and pinning is what makes a rollback one line instead of an
# investigation. See family-finances docs/deployment.md §3.
family_finances_version: "32307f2f47a8878f77187d1ad10290a41c20a798"

# Where the household databases and archived statements live on the host. This
# directory IS the family's financial record — it is what the PBS guest backup
# has to contain (family-finances docs/adr/0017-backup-posture.md).
family_finances_data_dir: /srv/family-finances

# Published for Traefik only. The backend is never published: nginx reaches it
# over the compose network, and publishing it would put a route to the API on
# the host that does not pass through the proxy.
family_finances_port: 8080

# The invitation code required to create a household. Unset closes
# registration, which is the safe direction and the tested one
# (family-finances docs/adr/0016-invite-only-registration.md).
family_finances_signup_code: "{{ vault_family_finances_signup_code }}"

# Bank sync over PSD2 (family-finances docs/adr/0023-enable-banking-as-provider.md).
#
# All three unset means sync is OFF, which is the safe direction and the one
# the app's tests assert -- a deployment that forgets them offers no bank
# connections rather than failing when a household tries to use one.
#
# The key is the APPLICATION's, not a household's: it grants nothing without a
# consent handle established by a member's own bank authorisation, and that
# lives inside the encrypted household database. Deployment configuration, so
# it sits beside the signup code rather than under the rules that govern
# household material (family-finances docs/adr/0022 §2, item 4).
enable_banking_app_id: "{{ vault_enable_banking_app_id }}"
enable_banking_private_key: "{{ vault_enable_banking_private_key }}"

# Deliberately NOT under family_finances_data_dir. That directory IS the
# family's financial record; an application credential has no business inside
# the thing the backups and the encryption exist to protect.
family_finances_secrets_dir: /srv/family-finances-secrets

# Must match a Redirect URL registered on the Enable Banking application
# EXACTLY, and production requires HTTPS. This is the SPA route added in
# d62ed1f; the /api/ variant is also registered and exists only so the probe
# can read the callback without the router rewriting it away.
enable_banking_redirect_url: "https://finances.itsa-pizza.com/oauth/callback"

# ghcr credentials. The family-finances repository is private, so its packages
# are private too — unlike library or sre-agent, whose repositories are public
# and whose images therefore disclose nothing by being pullable. The image
# carries the backend's Python source, so it stays private and the guest
# authenticates instead.
family_finances_ghcr_user: johnmathews
family_finances_ghcr_token: "{{ vault_family_finances_ghcr_token }}"
