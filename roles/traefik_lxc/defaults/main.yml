# Docker image versions
# Monitoring sidecars — versions come from `sidecar_*` in group_vars/all/main.yml,
# which is the single source for the whole fleet. Do not pin a literal here.
# Bumping the shared var needs `make refresh-sidecars`: compose handlers use
# pull:never, so `make <host>` alone will not fetch the new image.
traefik_lxc_cadvisor_version: "{{ sidecar_cadvisor_version }}"
traefik_lxc_alloy_version: "{{ sidecar_alloy_version }}"
