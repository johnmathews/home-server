# TrueNAS share refresh script (workaround for share activation bug)
nas_refresh_shares_enabled: true
nas_refresh_shares_nfs_path: "tank/document-store"
nas_refresh_shares_smb_path: "tank/time-machine-backups/johns-laptop"
nas_refresh_shares_wait_seconds: 5
nas_refresh_shares_log_file: "/mnt/swift/logs/refresh_shares.log"

nas_truenas_api_url: "https://192.168.2.104/api/v2.0"

# Safe reboot script configuration
nas_safe_reboot_max_retries: 4
nas_safe_reboot_retry_sleep_seconds: 300 # 5 minutes
nas_safe_reboot_io_sample_duration: 180 # 3 minutes - total I/O sampling period (6 samples)
nas_safe_reboot_io_sample_interval: 30 # 30 seconds - interval between samples
nas_safe_reboot_io_ops_threshold: 120 # operations/min - allow minimal background I/O below this (2 ops/sec average)
