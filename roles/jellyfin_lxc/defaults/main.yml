jellyfin_lxc_smb_username: smb_user
jellyfin_lxc_smb_server: 192.168.2.104

# Monitoring sidecars — versions come from `sidecar_*` in group_vars/all/main.yml,
# which is the single source for the whole fleet. Do not pin a literal here.
# Bumping the shared var needs `make refresh-sidecars`: compose handlers use
# pull:never, so `make jelly` alone will not fetch the new image.
jellyfin_lxc_alloy_version: "{{ sidecar_alloy_version }}"
jellyfin_lxc_cadvisor_version: "{{ sidecar_cadvisor_version }}"
jellyfin_lxc_node_exporter_version: "{{ sidecar_node_exporter_version }}"
