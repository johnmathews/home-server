# Docker image versions
agent_lxc_relay_version: "latest"
agent_lxc_syncthing_version: "latest"

# Synced folder roots under /srv/apps/syncthing; each gets the shared .stignore
agent_lxc_syncthing_folders:
  - horizons
  - relay
  - meeting-assistant
  - screenshots
# Monitoring sidecars — versions come from `sidecar_*` in group_vars/all/main.yml,
# which is the single source for the whole fleet. Do not pin a literal here.
# Bumping the shared var needs `make refresh-sidecars`: compose handlers use
# pull:never, so `make <host>` alone will not fetch the new image.
agent_lxc_cadvisor_version: "{{ sidecar_cadvisor_version }}"
agent_lxc_alloy_version: "{{ sidecar_alloy_version }}"
agent_lxc_node_exporter_version: "{{ sidecar_node_exporter_version }}"

agent_lxc_mkdocs_sites:
  - name: journal
    site_name: NanoClaw Journal
    docs_path: /srv/apps/nanoclaw/journal
    port: 8000
    order: desc
    date_titles: true
  - name: docs
    site_name: NanoClaw Docs
    docs_path: /srv/apps/nanoclaw/docs
    port: 8001
