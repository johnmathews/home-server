# Series / Season mapping for the Jellyfin "Health & Fitness" migration.
#
# Edit freely and re-run `migrate.py plan`. Rules enforced by the planner:
#   * every media file in every referenced source folder must land in exactly
#     one season (strays or duplicates abort the plan);
#   * a season is either a whole playlist folder (`folder = "..."`, episode
#     number = the existing `NNN-` prefix) or a list of YouTube IDs taken from a
#     folder (`folder = "..."`, `ids = [...]`, episodes numbered by upload date).
#
# Paths are relative to /mnt/tank/movies/youtube (NAS) == /movies/youtube (Jellyfin).

target_subdir = "fitness"           # new tree: /movies/youtube/fitness/<Series>/Season NN/
library_name  = "Health & Fitness"

# ----------------------------------------------------------------------------
[[series]]
name = "Heavy Club"

  [[series.seasons]]
  number = 1
  name   = "Basics"
  folder = "heavy-club-basics"

  [[series.seasons]]
  number = 2
  name   = "Exercise Tutorials"
  folder = "heavy-club-exercise-tutorials"

