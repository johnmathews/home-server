# requirements.yml
#
# Every entry is version-constrained. An unconstrained entry is not "always
# latest" — `ansible-galaxy collection install` does NOT upgrade an already
# installed collection unless `--upgrade` is passed, so an unconstrained entry
# actually resolves to "whatever happened to be installed first". That is how
# prometheus.prometheus sat at 0.27.4 for months while declaring support only up
# to ansible-core 2.18.99. The makefile now passes --upgrade; keep it.

collections:
  # Only consumer in this repo is community.general.locale_gen, in
  # roles/mail_vm (which is orphaned and scheduled for deletion). Floor is
  # >=12.2.0 to clear CVE-2025-14010 (unreachable here — it affects the Keycloak
  # modules), and this range matches the copy bundled in the venv so the two
  # installations agree instead of one shadowing the other.
  - name: community.general
    version: ">=13.3.0,<14.0.0"

  # 0.30.1 is the first release declaring support for ansible-core 2.21.
  # Consumed by roles/pve/tasks/smartctl.yml (prometheus.prometheus.smartctl_exporter).
  - name: prometheus.prometheus
    version: ">=0.30.1,<0.31.0"

roles:
  # Pinned to the versions currently deployed. `ansible-galaxy role install`
  # overwrites in place by default, so an unpinned role WILL silently jump a
  # major on the next `make requirements`.
  - name: geerlingguy.pip
    version: "3.1.2"
  - name: geerlingguy.docker
    version: "8.0.0"
